  <rect x="260" y="150" width="12" height="8" fill="#CFCFCF" stroke="#000" stroke-width="1.5"/>
  <rect x="285" y="150" width="12" height="8" fill="#CFCFCF" stroke="#000" stroke-width="1.5"/>

  <!-- Bow jackstaff -->
  <line x1="180" y1="158" x2="180" y2="130" stroke="#000" stroke-width="1.5"/>
  <circle cx="180" cy="128" r="2" fill="#000"/>

  <!-- Foremast -->
  <line x1="270" y1="158" x2="270" y2="55" stroke="#000" stroke-width="3"/>
  <line x1="248" y1="105" x2="292" y2="105" stroke="#000" stroke-width="2"/>
  <line x1="255" y1="78" x2="285" y2="78" stroke="#000" stroke-width="1.5"/>
  <circle cx="270" cy="52" r="3" fill="#000"/>
  <line x1="270" y1="105" x2="222" y2="158" stroke="#CFCFCF" stroke-width="1"/>
  <line x1="270" y1="105" x2="316" y2="158" stroke="#CFCFCF" stroke-width="1"/>
  <line x1="270" y1="78" x2="232" y2="158" stroke="#CFCFCF" stroke-width="1"/>
  <line x1="270" y1="78" x2="308" y2="158" stroke="#CFCFCF" stroke-width="1"/>

