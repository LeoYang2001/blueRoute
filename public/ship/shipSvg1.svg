    <rect x="650" y="184" width="6" height="6"/>
    <rect x="850" y="184" width="6" height="6"/>
    <rect x="1050" y="184" width="6" height="6"/>
  </g>

  <!-- Mushroom vents -->
  <g fill="#fff" stroke="#000" stroke-width="1.5">
    <rect x="400" y="180" width="3" height="10"/>
    <rect x="403" y="178" width="8" height="3"/>
    <rect x="500" y="180" width="3" height="10"/>
    <rect x="503" y="178" width="8" height="3"/>
    <rect x="720" y="180" width="3" height="10"/>
    <rect x="723" y="178" width="8" height="3"/>
    <rect x="820" y="180" width="3" height="10"/>
    <rect x="823" y="178" width="8" height="3"/>
    <rect x="1020" y="180" width="3" height="10"/>
    <rect x="1023" y="178" width="8" height="3"/>
    <rect x="1120" y="180" width="3" height="10"/>
    <rect x="1123" y="178" width="8" height="3"/>
