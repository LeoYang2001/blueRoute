<svg width="1345" height="470" viewBox="0 -55 1345 470" fill="none" xmlns="http://www.w3.org/2000/svg">

  <!-- ======================== HULL (bow half) ======================== -->

  <!-- Below-waterline shading -->
  <path d="M 120 300 L 1345 300 L 1345 335 L 118 335 C 70 339, 28 326, 12 312 C 28 300, 70 298, 120 300 Z" fill="#E1E1E1"/>

  <!-- Main hull body outline (truncated at midship) -->
  <path d="M 175 158 L 320 158 L 320 190 L 1345 190 L 1345 335 L 118 335 C 70 339, 28 326, 12 312 C 28 290, 70 295, 120 295 C 135 258, 160 200, 175 158 Z" fill="#fff" stroke="#000" stroke-width="2"/>

  <!-- Forecastle aft break -->
  <line x1="320" y1="158" x2="320" y2="190" stroke="#000" stroke-width="2"/>

  <!-- Sheer strake -->
  <line x1="320" y1="202" x2="1345" y2="202" stroke="#CFCFCF" stroke-width="1"/>

  <!-- Cargo tank division lines -->
  <line x1="635" y1="202" x2="635" y2="295" stroke="#CFCFCF" stroke-width="1"/>
  <line x1="950" y1="202" x2="950" y2="295" stroke="#CFCFCF" stroke-width="1"/>
  <line x1="1265" y1="202" x2="1265" y2="295" stroke="#CFCFCF" stroke-width="1"/>

  <!-- Waterline -->
  <line x1="0" y1="300" x2="1345" y2="300" stroke="#000" stroke-width="1" stroke-dasharray="6 5"/>

  <!-- Plimsoll mark (Load line disc) -->
  <circle cx="1320" cy="248" r="13" fill="none" stroke="#000" stroke-width="1.5"/>
  <line x1="1300" y1="248" x2="1340" y2="248" stroke="#000" stroke-width="1.5"/>

  <!-- Draft marks at bow -->
  <g stroke="#000" stroke-width="1.5">
    <line x1="155" y1="225" x2="165" y2="225"/>
    <line x1="155" y1="240" x2="165" y2="240"/>
    <line x1="155" y1="255" x2="165" y2="255"/>
    <line x1="155" y1="270" x2="165" y2="270"/>
    <line x1="155" y1="285" x2="165" y2="285"/>
  </g>

  <!-- Hawse pipes -->
  <circle cx="200" cy="220" r="7" fill="#E1E1E1" stroke="#000" stroke-width="1.5"/>
  <circle cx="240" cy="225" r="7" fill="#E1E1E1" stroke="#000" stroke-width="1.5"/>

  <!-- Stowed anchor -->
  <path d="M 210 230 L 215 245 L 222 252 L 230 245 L 235 232 L 232 230 L 225 240 L 218 230 Z" fill="#CFCFCF" stroke="#000" stroke-width="1.5"/>
  <line x1="222" y1="252" x2="222" y2="258" stroke="#000" stroke-width="1.5"/>

  <!-- Bow bulwark cap line -->
  <line x1="175" y1="158" x2="320" y2="158" stroke="#000" stroke-width="2"/>

  <!-- ======================== FORECASTLE EQUIPMENT ======================== -->

  <!-- Mooring winch / windlass -->
