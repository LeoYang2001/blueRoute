  <line x1="335" y1="170" x2="1345" y2="170" stroke="#CFCFCF" stroke-width="2"/>
  <line x1="335" y1="176" x2="1345" y2="176" stroke="#CFCFCF" stroke-width="2"/>
  <line x1="335" y1="182" x2="1345" y2="182" stroke="#CFCFCF" stroke-width="2"/>

