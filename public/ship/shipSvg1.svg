  <!-- Midship manifold (left half — continues in stern SVG) -->
  <rect x="1305" y="155" width="10" height="35" fill="#CFCFCF" stroke="#000" stroke-width="1.5"/>
  <rect x="1330" y="150" width="10" height="40" fill="#CFCFCF" stroke="#000" stroke-width="1.5"/>
  <rect x="1290" y="138" width="55" height="6" fill="#fff" stroke="#000" stroke-width="2"/>
  <line x1="1292" y1="144" x2="1292" y2="155" stroke="#000" stroke-width="1.5"/>
  <line x1="1290" y1="138" x2="1290" y2="128" stroke="#000" stroke-width="1.5"/>
  <line x1="1290" y1="128" x2="1345" y2="128" stroke="#000" stroke-width="1.5"/>
  <line x1="1290" y1="133" x2="1345" y2="133" stroke="#CFCFCF" stroke-width="1"/>

  <!-- Bulwark top railing -->
  <line x1="320" y1="190" x2="1345" y2="190" stroke="#000" stroke-width="2"/>

</svg>
